services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - workops_mongo:/data/db

  api:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongodb:27017/workops
      JWT_ACCESS_SECRET: change-me-access-secret
      JWT_REFRESH_SECRET: change-me-refresh-secret
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
      CLIENT_URL: http://localhost:5173
      COOKIE_SECURE: "false"
      UPLOAD_DIR: /app/storage/uploads
      MAX_UPLOAD_MB: 10
      LOG_LEVEL: info
    volumes:
      - workops_uploads:/app/storage/uploads
    depends_on:
      - mongodb

volumes:
  workops_mongo:
  workops_uploads:
